name: Release

# Trigger on any tag push matching v* (e.g. v1.0.0, v2.1.3)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/upload GitHub Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Build all binaries
        run: make all

      - name: List build artifacts
        run: ls -lh builds/

      - name: Commit builds to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add builds/
          git diff --cached --quiet || git commit -m "ci: update builds for ${{ github.ref_name }}"
          git push https://x-access-token:${{ secrets.BUILDS_TOKEN }}@github.com/${{ github.repository }} main

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: "Lupo ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: builds/*
